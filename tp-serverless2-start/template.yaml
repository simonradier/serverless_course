AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Template SAM pour le TP 2 du cours serverless
  
# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 3

Resources:
  TaskCrudFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: code/
      Handler: app.lambdaHandler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Events:
        GetTasks:
          Type: Api 
          Properties:
            Path: /tasks
            Method: get
    Metadata: 
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        Sourcemap: true
        EntryPoints: 
        - task-crud/index.ts
  NotificationGeneratordFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: code/
      Handler: index.lambdaHandler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
    Metadata: 
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        Sourcemap: true
        EntryPoints: 
        - notification-generator/index.ts

Outputs:
  TasksApi:
    Description: "API Gateway endpoint URL for Prod stage for Hello World function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/tasks/"
  TaskCrudFunction:
    Description: "API Gateway endpoint URL for Prod stage for Hello World function"
    Value: !Ref TaskCrudFunction
  TaskCrudFunctionIamRole:
    Description: "Implicit IAM Role created for Hello World function"
    Value: !GetAtt TaskCrudFunctionRole.Arn
